var:
  wordmarkSvg: |-
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5.5"/>
      <path d="M12 1v22M1 12h22"/>
    </svg>
  faviconUrl: |-
    data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b0402a' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='5.5'/%3E%3Cpath d='M12 1v22M1 12h22'/%3E%3C/svg%3E
  prePaintScript: |-
    /* Language choice, resolved before first paint.
       Priority: ?lang= query param > localStorage > "ts". */
    (function () {
      var q = new URLSearchParams(location.search).get("lang");
      var saved = null;
      try { saved = localStorage.getItem("epure-vitest-lang"); } catch (e) {}
      var lang = (q === "ts" || q === "res") ? q : (saved === "res" ? "res" : "ts");
      document.documentElement.setAttribute("data-lang", lang);
    })();
  toggleListenerScript: |-
    /* Language toggle: one delegated listener flips html[data-lang] and persists.
       The buttons carry no state — CSS renders them from the attribute. */
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".lang-toggle, .toggle")) return;
      var next = document.documentElement.getAttribute("data-lang") === "ts" ? "res" : "ts";
      document.documentElement.setAttribute("data-lang", next);
      try { localStorage.setItem("epure-vitest-lang", next); } catch (err) {}
    });
  docsScrollSpyScript: |-
    /* Scroll-spy: highlight the current chapter in the reading path. */
    (function () {
      var links = {};
      document.querySelectorAll(".toc a[href^='#']").forEach(function (a) {
        links[a.hash.slice(1)] = a;
      });
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          Object.keys(links).forEach(function (id) { links[id].removeAttribute("aria-current"); });
          links[en.target.id].setAttribute("aria-current", "true");
        });
      }, { rootMargin: "-10% 0px -75% 0px" });
      document.querySelectorAll(".chapter[id]").forEach(function (s) { spy.observe(s); });
    })();
  viewSwitchScript: |-
    /* feature | steps toggle on contract figures — per figure, delegated,
       independent of the global language toggle. */
    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".viewswitch button");
      if (!btn) return;
      var fig = btn.closest("figure");
      fig.setAttribute("data-view", btn.dataset.view);
      fig.querySelectorAll(".viewswitch button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  toggleButton: |-
    <button class="lang-toggle" type="button" aria-label="Switch example language"><span class="lt lt-ts">TS</span><span class="lt lt-res">RES</span></button>
  signatureTs:
    value: "{{signature.ts}}"
    transform: typescript
  signatureRes:
    value: "{{signature.res}}"
    transform: rescript
  tagSpans:
    list: tags
    each: <span>{{item}}</span>
  refsBlock:
    list: refs
    each: <a href="./api.html#{{item}}">{{item}}</a>
    join: ", "
    template: '<p class="xref">Reference: {{body}} <span class="arrow">→</span></p>'
  homeCurrentAttr: ""
  guideCurrentAttr: ""
  apiCurrentAttr: ""
  prePaint: ""
  skip: ""
  mainAttrs: ""
  scripts: ""
  header: |-
    <header class="top">
      <div class="wrap">
        <a class="wordmark" href="./index.html" aria-label="@epure/vitest — home">{{wordmarkSvg}}@epure/vitest</a>
        <nav class="nav" aria-label="Site">
          <a href="./index.html"{{homeCurrentAttr}}>Home</a>
          <a href="./guide.html"{{guideCurrentAttr}}>Guide</a>
          <a href="./api.html"{{apiCurrentAttr}}>API</a>
          <a href="https://github.com/epuremethod/vitest">GitHub</a>
        </nav>
      </div>
    </header>
  footer: |-
    <footer class="foot">
      <div class="wrap">
        <div class="fcell"><span class="lbl">Package</span><span class="val"><a href="https://www.npmjs.com/package/@epure/vitest">@epure/vitest on npm</a></span></div>
        <div class="fcell"><span class="lbl">Source</span><span class="val"><a href="https://github.com/epuremethod/vitest">github.com/epuremethod/vitest</a></span></div>
        <div class="fcell"><span class="lbl">License</span><span class="val">MIT</span></div>
        <div class="fcell"><span class="lbl">Method</span><span class="val"><a href="https://epuremethod.com">épure</a></span></div>
        <div class="fcell"><span class="lbl">Site</span><span class="val">epurejs.dev</span></div>
      </div>
    </footer>
  shell: |-
    <!doctype html>
    <html {{htmlAttrs}}>
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="icon" href="{{faviconUrl}}">
    <link rel="stylesheet" href="./style.css">
    {{prePaint}}
    </head>
    <body>
    {{skip}}
    {{header}}
    <main{{mainAttrs}}>
    {{main}}
    </main>
    {{footer}}
    {{scripts}}
    </body>
    </html>
